<nav class="navbar" [class.menu-open]="menuOpen">
  <div class="navbar-container">
    <!-- Logo -->
    <a class="logo" routerLink="/" (click)="closeMenu()" aria-label="Home">Nikhil</a>

    <!-- Desktop links -->
    <div class="nav-links desktop-only">
      <button
        class="nav-button"
        type="button"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="scrollTo('top')"
      >Home</button>

      <button
        class="nav-button"
        type="button"
        routerLink="/projects"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >Projects</button>

      <a href="/assets/Nikhil_Resume.pdf" target="_blank" class="nav-button">
        Resume
      </a>

      <button
        class="nav-button"
        type="button"
        routerLink="/gallery"
        routerLinkActive="active"
      >Gallery</button>

      <button
        class="nav-button"
        type="button"
        routerLink="/games/wordle"
        routerLinkActive="active"
      >Games</button>
    </div>

    <!-- Desktop CTA -->
    <div class="nav-cta desktop-only">
      <a
        href="https://www.linkedin.com/in/nikhil-patra-b81906244"
        target="_blank"
        rel="noopener noreferrer"
      >
        <button class="cta-button">Let's talk</button>
      </a>
    </div>

    <!-- Hamburger (mobile only) -->
    <button
      class="hamburger mobile-only"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Close navigation' : 'Open navigation'"
    >
      <span class="bar bar-1"></span>
      <span class="bar bar-2"></span>
      <span class="bar bar-3"></span>
    </button>
  </div>
</nav>

<!-- Mobile overlay backdrop -->
<div
  class="mobile-backdrop mobile-only"
  [class.open]="menuOpen"
  (click)="closeMenu()"
  aria-hidden="true"
></div>

<!-- Mobile slide-in drawer -->
<div
  class="mobile-drawer mobile-only"
  [class.open]="menuOpen"
  role="dialog"
  aria-modal="true"
  aria-label="Navigation menu"
>
  <!-- Close button inside drawer -->
  <button
    class="drawer-close"
    type="button"
    (click)="closeMenu()"
    aria-label="Close navigation"
  >
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="drawer-logo">Nikhil</div>

  <nav class="drawer-links" aria-label="Mobile navigation">
    <button
      class="drawer-link"
      type="button"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="scrollTo('top')"
    >Home</button>

    <button
      class="drawer-link"
      type="button"
      routerLink="/projects"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >Projects</button>

    <a
      href="/assets/Nikhil_Resume.pdf"
      target="_blank"
      class="drawer-link"
      (click)="closeMenu()"
    >Resume</a>

    <button
      class="drawer-link"
      type="button"
      routerLink="/gallery"
      routerLinkActive="active"
      (click)="closeMenu()"
    >Gallery</button>

    <button
      class="drawer-link"
      type="button"
      routerLink="/games/wordle"
      routerLinkActive="active"
      (click)="closeMenu()"
    >Games</button>
  </nav>

  <div class="drawer-footer">
    <a
      href="https://www.linkedin.com/in/nikhil-patra-b81906244"
      target="_blank"
      rel="noopener noreferrer"
      class="drawer-cta"
      (click)="closeMenu()"
    >Let's talk</a>
  </div>
</div>
